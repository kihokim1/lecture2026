<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="800" height="330" fill="#f8fafc"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">눈금이 적은 게 문제가 아니라, 어디에 펼치느냐가 문제다</text>
  <text x="400" y="54" text-anchor="middle" font-size="13.5" fill="#64748b">눈금 8개짜리 자 하나로 — 어느 범위를 재느냐에 따라 정밀도가 100배 달라진다</text>

  <rect x="40" y="76" width="720" height="106" rx="10" fill="#ffffff" stroke="#fdba74"/>
  <text x="62" y="102" font-size="15" font-weight="700" fill="#b45309">0 ~ 100 에 펼치면</text>
  <line x1="150" y1="140" x2="700" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <g font-size="12.5" fill="#64748b" text-anchor="middle">
    <line x1="150" y1="132" x2="150" y2="148" stroke="#94a3b8" stroke-width="2"/><text x="150" y="166">0</text>
    <line x1="219" y1="134" x2="219" y2="146" stroke="#cbd5e1"/><text x="219" y="166">12.5</text>
    <line x1="288" y1="134" x2="288" y2="146" stroke="#cbd5e1"/><text x="288" y="166">25</text>
    <line x1="357" y1="134" x2="357" y2="146" stroke="#cbd5e1"/><text x="357" y="166">37.5</text>
    <line x1="426" y1="134" x2="426" y2="146" stroke="#cbd5e1"/><text x="426" y="166">50</text>
    <line x1="495" y1="134" x2="495" y2="146" stroke="#cbd5e1"/><text x="495" y="166">62.5</text>
    <line x1="564" y1="134" x2="564" y2="146" stroke="#cbd5e1"/><text x="564" y="166">75</text>
    <line x1="633" y1="134" x2="633" y2="146" stroke="#cbd5e1"/><text x="633" y="166">87.5</text>
    <line x1="700" y1="132" x2="700" y2="148" stroke="#94a3b8" stroke-width="2"/><text x="700" y="166">100</text>
  </g>
  <text x="62" y="132" font-size="13" fill="#9a3412">눈금 하나 =</text>
  <text x="62" y="152" font-size="17" font-weight="700" fill="#b45309">12.5</text>

  <rect x="40" y="196" width="720" height="106" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="62" y="222" font-size="15" font-weight="700" fill="#047857">0 ~ 1 에 펼치면</text>
  <line x1="150" y1="260" x2="700" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <g font-size="12.5" fill="#64748b" text-anchor="middle">
    <line x1="150" y1="252" x2="150" y2="268" stroke="#94a3b8" stroke-width="2"/><text x="150" y="286">0</text>
    <line x1="219" y1="254" x2="219" y2="266" stroke="#cbd5e1"/><text x="219" y="286">0.125</text>
    <line x1="288" y1="254" x2="288" y2="266" stroke="#cbd5e1"/><text x="288" y="286">0.25</text>
    <line x1="357" y1="254" x2="357" y2="266" stroke="#cbd5e1"/><text x="357" y="286">0.375</text>
    <line x1="426" y1="254" x2="426" y2="266" stroke="#cbd5e1"/><text x="426" y="286">0.5</text>
    <line x1="495" y1="254" x2="495" y2="266" stroke="#cbd5e1"/><text x="495" y="286">0.625</text>
    <line x1="564" y1="254" x2="564" y2="266" stroke="#cbd5e1"/><text x="564" y="286">0.75</text>
    <line x1="633" y1="254" x2="633" y2="266" stroke="#cbd5e1"/><text x="633" y="286">0.875</text>
    <line x1="700" y1="252" x2="700" y2="268" stroke="#94a3b8" stroke-width="2"/><text x="700" y="286">1</text>
  </g>
  <text x="62" y="252" font-size="13" fill="#065f46">눈금 하나 =</text>
  <text x="62" y="272" font-size="17" font-weight="700" fill="#047857">0.125</text>

  <text x="400" y="318" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">가중치는 −0.12 ~ +0.13 같은 좁은 범위에 몰려 있다 — 그래서 256칸으로도 충분하다</text>
</svg>
