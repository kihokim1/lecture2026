<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="800" height="340" fill="#f8fafc"/>
  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">같은 비트 수, 다른 결과 — 자를 몇 개 쓰느냐</text>
  <text x="400" y="52" text-anchor="middle" font-size="13.5" fill="#64748b">8비트에서는 셋 다 같다가, 여유가 사라지는 순간 갈린다 (실측 · 원본 97.33%)</text>

  <rect x="150" y="64" width="15" height="15" fill="#94a3b8"/><text x="172" y="77" font-size="13" fill="#334155">모델 전체에 하나</text>
  <rect x="330" y="64" width="15" height="15" fill="#0ea5e9"/><text x="352" y="77" font-size="13" fill="#334155">층마다 하나</text>
  <rect x="490" y="64" width="15" height="15" fill="#10b981"/><text x="512" y="77" font-size="13" fill="#334155">채널마다 하나</text>

  <line x1="110" y1="102" x2="110" y2="252" stroke="#94a3b8"/>
  <line x1="110" y1="252" x2="750" y2="252" stroke="#94a3b8"/>
