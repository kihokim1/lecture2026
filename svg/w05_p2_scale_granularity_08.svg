  <text x="102" y="256" text-anchor="end" font-size="12.5" fill="#94a3b8">0</text>
  <text x="58" y="94" font-size="13.5" fill="#334155">정확도(%)</text>

  <g>
    <rect x="140" y="106" width="36" height="146" rx="3" fill="#94a3b8"/>
