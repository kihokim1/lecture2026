  <text x="675" y="304" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">10% = 찍는 것</text>
  <text x="40" y="304" font-size="14.5" font-weight="700" fill="#0f172a">"몇 비트로 줄였다"는 말만으로는 아무것도 알 수 없다</text>
