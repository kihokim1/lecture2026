    <text x="358" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">97.33 · 97.78 · 96.89</text>
  </g>
  <g>
    <rect x="460" y="149" width="36" height="103" rx="3" fill="#94a3b8"/>
    <text x="478" y="141" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">68.89</text>
    <rect x="500" y="106" width="36" height="146" rx="3" fill="#0ea5e9"/>
    <text x="518" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">97.33</text>
    <rect x="540" y="107" width="36" height="145" rx="3" fill="#10b981"/>
    <text x="558" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">3비트</text>
