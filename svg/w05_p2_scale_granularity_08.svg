    <text x="198" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">97.56 · 97.56 · 97.56</text>
  </g>
  <g>
    <rect x="300" y="106" width="36" height="146" rx="3" fill="#94a3b8"/>
    <rect x="340" y="105" width="36" height="147" rx="3" fill="#0ea5e9"/>
    <rect x="380" y="107" width="36" height="145" rx="3" fill="#10b981"/>
