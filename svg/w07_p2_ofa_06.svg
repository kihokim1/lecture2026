<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="800" height="392" fill="#f8fafc"/>
  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Once-for-All — 학습 1회, 배포 다수</text>
  <text x="400" y="52" text-anchor="middle" font-size="13.5" fill="#64748b">기기마다 탐색을 다시 돌리면 비용이 기기 수에 비례해 폭발한다</text>
  <rect x="40" y="86" width="250" height="180" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="165" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#6d28d9">Supernet</text>
  <text x="165" y="140" text-anchor="middle" font-size="13" fill="#334155">모든 후보를 품은 거대망</text>
  <text x="165" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">딱 한 번만 학습한다</text>
  <text x="165" y="200" text-anchor="middle" font-size="12.5" fill="#475569">progressive shrinking으로</text>
  <text x="165" y="219" text-anchor="middle" font-size="12.5" fill="#475569">깊이·너비·커널·해상도를</text>
  <text x="165" y="238" text-anchor="middle" font-size="12.5" fill="#475569">점진적으로 줄여 가며</text>
  <rect x="470" y="88" width="300" height="52" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
  <text x="492" y="110" font-size="14" font-weight="700" fill="#dc2626">MCU</text>
  <text x="492" y="130" font-size="12.5" fill="#475569">메모리 극소</text>
  <text x="752" y="121" text-anchor="end" font-size="12.5" font-weight="700" fill="#dc2626">서브넷 추출</text>
  <path d="M292 176 C 360 176, 400 114, 466 114" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#g8)"/>
  <rect x="470" y="150" width="300" height="52" rx="10" fill="#ffffff" stroke="#e4711b" stroke-width="1.8"/>
  <text x="492" y="172" font-size="14" font-weight="700" fill="#e4711b">모바일</text>
  <text x="492" y="192" font-size="12.5" fill="#475569">지연 예산 빡빡</text>
  <text x="752" y="183" text-anchor="end" font-size="12.5" font-weight="700" fill="#e4711b">서브넷 추출</text>
  <path d="M292 176 C 360 176, 400 176, 466 176" fill="none" stroke="#e4711b" stroke-width="2" marker-end="url(#g8)"/>
  <rect x="470" y="212" width="300" height="52" rx="10" fill="#ffffff" stroke="#028090" stroke-width="1.8"/>
  <text x="492" y="234" font-size="14" font-weight="700" fill="#028090">엣지 GPU</text>
  <text x="492" y="254" font-size="12.5" fill="#475569">정확도 우선</text>
  <text x="752" y="245" text-anchor="end" font-size="12.5" font-weight="700" fill="#028090">서브넷 추출</text>
  <path d="M292 176 C 360 176, 400 238, 466 238" fill="none" stroke="#028090" stroke-width="2" marker-end="url(#g8)"/>
  <text x="380" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">재학습 없이</text>
  <rect x="40" y="306" width="730" height="72" rx="12" fill="#ecfdf5" stroke="#10b981"/>
  <text x="405" y="330" text-anchor="middle" font-size="14.5" font-weight="700" fill="#047857">뽑아낼 수 있는 서브넷이 10의 19제곱 개를 넘는다</text>
  <text x="405" y="354" text-anchor="middle" font-size="13" fill="#334155">배포 시나리오 40개 기준 총 GPU 시간 — MnasNet 1,600,000시간 → OFA 1,200시간</text>
  <text x="405" y="372" text-anchor="middle" font-size="12" fill="#64748b">주의: OFA 논문에는 「파레토」라는 단어가 나오지 않는다. 그들은 「트레이드오프 곡선」이라 쓴다</text>
  <defs><marker id="g8" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#94a3b8"/></marker></defs>

</svg>
