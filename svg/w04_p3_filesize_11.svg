  <text x="400" y="50" text-anchor="middle" font-size="13" fill="#64748b">0도 4바이트를 차지하는 float이다 · 다만 같은 값의 반복이라 압축은 아주 잘 된다</text>

  <rect x="180" y="66" width="15" height="15" fill="#94a3b8"/><text x="202" y="79" font-size="12.5" fill="#334155">저장된 .pt 파일</text>
  <rect x="420" y="66" width="15" height="15" fill="#0ea5e9"/><text x="442" y="79" font-size="12.5" fill="#334155">zip으로 압축한 크기</text>

