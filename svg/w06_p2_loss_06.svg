<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 366" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="800" height="366" fill="#f8fafc"/>
  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">증류 손실 — 두 스승의 가중 합</text>
  <text x="400" y="52" text-anchor="middle" font-size="13.5" fill="#64748b">학생의 출력이 두 갈래로 갈라져 각각 다른 스승과 비교된다</text>
  <rect x="34" y="140" width="132" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="100" y="170" text-anchor="middle" font-size="14.5" font-weight="700" fill="#15803d">학생 로짓</text>
  <text x="100" y="192" text-anchor="middle" font-size="13" fill="#334155">z_S</text>
  <path d="M166 160 C 200 160, 210 108, 244 108" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#p)"/>
  <rect x="248" y="80" width="150" height="56" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="323" y="104" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d28d9">softmax(z_S / T)</text>
  <text x="323" y="125" text-anchor="middle" font-size="12.5" fill="#475569">온도를 적용한 분포</text>
  <path d="M166 190 C 200 190, 210 244, 244 244" fill="none" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#o)"/>
  <rect x="248" y="216" width="150" height="56" rx="9" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="323" y="240" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b45309">softmax(z_S)</text>
  <text x="323" y="261" text-anchor="middle" font-size="12.5" fill="#475569">평소의 출력 (T=1)</text>
  <rect x="440" y="80" width="150" height="56" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="515" y="104" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e40af">교사 소프트 타깃</text>
  <text x="515" y="125" text-anchor="middle" font-size="12.5" fill="#475569">softmax(z_T / T)</text>
  <rect x="440" y="216" width="150" height="56" rx="9" fill="#fee2e2" stroke="#dc2626"/>
  <text x="515" y="240" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">실제 정답 y</text>
  <text x="515" y="261" text-anchor="middle" font-size="12.5" fill="#475569">one-hot</text>
  <path d="M398 108 H436" stroke="#94a3b8" stroke-width="2" marker-end="url(#g)"/>
  <path d="M398 244 H436" stroke="#94a3b8" stroke-width="2" marker-end="url(#g)"/>
  <rect x="620" y="76" width="152" height="64" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="696" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">증류 손실</text>
  <text x="696" y="123" text-anchor="middle" font-size="13" fill="#334155">T² · KL(q_T ‖ q_S)</text>
  <rect x="620" y="212" width="152" height="64" rx="9" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="696" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">학생 손실</text>
  <text x="696" y="259" text-anchor="middle" font-size="13" fill="#334155">CE(y, p_S)</text>
  <path d="M590 108 H616" stroke="#94a3b8" stroke-width="2" marker-end="url(#g)"/>
  <path d="M590 244 H616" stroke="#94a3b8" stroke-width="2" marker-end="url(#g)"/>
  <rect x="220" y="308" width="360" height="42" rx="10" fill="#07302e"/>
  <text x="400" y="335" text-anchor="middle" font-size="16" font-weight="700" fill="#58d6bd">L = α · T² · KL  +  (1−α) · CE</text>
  <text x="112" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">α 만큼 교사 흉내</text>
  <text x="690" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">(1−α) 만큼 정답 맞추기</text>
  <defs><marker id="p" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#7c3aed"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#f59e0b"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#94a3b8"/></marker></defs>

</svg>
