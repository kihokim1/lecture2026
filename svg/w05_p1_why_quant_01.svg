<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="760" height="300" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">왜 양자화인가 — FP32 → INT8</text>

  <!-- FP32 -->
  <rect x="40" y="70" width="320" height="180" rx="12" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="200" y="98" text-anchor="middle" font-size="15.5" font-weight="700" fill="#b45309">FP32 (32비트 부동소수점)</text>
  <g>
    <rect x="70" y="120" width="260" height="26" fill="#fed7aa" stroke="#f59e0b"/>
    <text x="200" y="138" text-anchor="middle" font-size="13" fill="#7c2d12">32 bits × 파라미터 수</text>
  </g>
  <text x="70" y="176" font-size="13.5" fill="#7c2d12">· 모델 크기 큼 (기준)</text>
  <text x="70" y="200" font-size="13.5" fill="#7c2d12">· FPU(부동소수점 유닛) 필요</text>
  <text x="70" y="224" font-size="13.5" fill="#7c2d12">· 전력·면적 큼</text>

  <!-- arrow -->
  <path d="M366 160 H404" stroke="#16a34a" stroke-width="3" marker-end="url(#a)"/>
  <text x="385" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">양자화</text>

  <!-- INT8 -->
  <rect x="410" y="70" width="320" height="180" rx="12" fill="#ecfdf5" stroke="#10b981"/>
  <text x="570" y="98" text-anchor="middle" font-size="15.5" font-weight="700" fill="#047857">INT8 (8비트 정수)</text>
  <rect x="440" y="120" width="65" height="26" fill="#a7f3d0" stroke="#10b981"/>
  <text x="472" y="138" text-anchor="middle" font-size="13" fill="#064e3b">8 bits</text>
  <text x="520" y="138" font-size="14" font-weight="700" fill="#047857">→ 크기 1/4</text>
  <text x="440" y="176" font-size="13.5" fill="#064e3b">· 메모리·대역폭 대폭 절감</text>
  <text x="440" y="200" font-size="13.5" fill="#064e3b">· 정수 유닛(ALU)이 작고 빠름</text>
  <text x="440" y="224" font-size="13.5" fill="#064e3b">· 전력 소모 적음</text>

  <text x="380" y="284" text-anchor="middle" font-size="13.5" fill="#334155">핵심 이득 = 메모리 대역폭 절감 + 정수 연산의 효율 (2주차 하드웨어와 직결)</text>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#16a34a"/></marker></defs>
</svg>
