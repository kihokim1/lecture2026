<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 336" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="800" height="336" fill="#f8fafc"/>
  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">NAS의 3대 요소</text>
  <text x="400" y="52" text-anchor="middle" font-size="13.5" fill="#64748b">Elsken 외, JMLR 2019 의 분해</text>
  <rect x="26" y="74" width="244" height="216" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="148" y="102" text-anchor="middle" font-size="16" font-weight="700" fill="#2563eb">탐색 공간</text>
  <text x="148" y="121" text-anchor="middle" font-size="12" fill="#64748b">Search Space</text>
  <text x="148" y="146" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">무엇을 고를 수 있나</text>
  <text x="46" y="174" font-size="12.5" fill="#334155">· 어떤 연산(Conv·Depthwise·Pool)</text>
  <text x="46" y="197" font-size="12.5" fill="#334155">· 깊이·너비·커널 크기</text>
  <text x="46" y="220" font-size="12.5" fill="#334155">· 연결 방식</text>
  <rect x="44" y="248" width="208" height="28" rx="7" fill="#ffffff" stroke="#2563eb"/>
  <text x="148" y="267" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563eb">넓으면 자유롭지만 찾기 어렵다</text>
  <rect x="280" y="74" width="244" height="216" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="402" y="102" text-anchor="middle" font-size="16" font-weight="700" fill="#7c3aed">탐색 전략</text>
  <text x="402" y="121" text-anchor="middle" font-size="12" fill="#64748b">Search Strategy</text>
  <text x="402" y="146" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">어떻게 찾나</text>
  <text x="300" y="174" font-size="12.5" fill="#334155">· 강화학습 (RL)</text>
  <text x="300" y="197" font-size="12.5" fill="#334155">· 진화 알고리즘 (EA)</text>
  <text x="300" y="220" font-size="12.5" fill="#334155">· 미분 가능 탐색 (Gradient)</text>
  <rect x="298" y="248" width="208" height="28" rx="7" fill="#ffffff" stroke="#7c3aed"/>
  <text x="402" y="267" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7c3aed">랜덤 서치도 강력한 기준선이다</text>
  <rect x="534" y="74" width="244" height="216" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="656" y="102" text-anchor="middle" font-size="16" font-weight="700" fill="#10b981">성능 추정</text>
  <text x="656" y="121" text-anchor="middle" font-size="12" fill="#64748b">Performance Estimation</text>
  <text x="656" y="146" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">얼마나 좋은지</text>
  <text x="554" y="174" font-size="12.5" fill="#334155">· 조기 종료</text>
  <text x="554" y="197" font-size="12.5" fill="#334155">· 가중치 공유 (supernet)</text>
  <text x="554" y="220" font-size="12.5" fill="#334155">· 성능 예측기</text>
  <rect x="552" y="248" width="208" height="28" rx="7" fill="#ffffff" stroke="#10b981"/>
  <text x="656" y="267" text-anchor="middle" font-size="11.5" font-weight="700" fill="#10b981">NAS 비용을 지배하는 항</text>
  <text x="400" y="318" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">이 셋 어디에도 「무엇을 잘한다고 볼 것인가」가 안 적혀 있다 — 그것은 목적 함수가 정한다</text>

</svg>
