<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="800" height="412" fill="#f8fafc"/>
  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">연산량 3.9배 적은 모델이 3.16배 느리다</text>
  <text x="400" y="52" text-anchor="middle" font-size="13.5" fill="#64748b">실측 후보 두 개를 나란히 놓으면</text>
  <rect x="26" y="76" width="360" height="212" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="206" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#e4711b">연산량이 적은 쪽</text>
  <text x="206" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">w12·d4·k5·sep·e2.0·flatten</text>
  <rect x="48" y="146" width="316" height="38" rx="7" fill="#ffffff" stroke="#f59e0b" stroke-width="0.9"/>
  <text x="64" y="170" font-size="13" fill="#475569">연산량 (MACs)</text>
  <text x="348" y="171" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">283,336</text>
  <rect x="48" y="190" width="316" height="38" rx="7" fill="#ffffff" stroke="#f59e0b" stroke-width="0.9"/>
  <text x="64" y="214" font-size="13" fill="#475569">배치 1 지연</text>
  <text x="348" y="215" text-anchor="end" font-size="16" font-weight="700" fill="#e4711b">0.496 ms</text>
  <rect x="48" y="234" width="316" height="38" rx="7" fill="#ffffff" stroke="#f59e0b" stroke-width="0.9"/>
  <text x="64" y="258" font-size="13" fill="#475569">정확도</text>
  <text x="348" y="259" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">80.95 %</text>
  <rect x="414" y="76" width="360" height="212" rx="12" fill="#edf6f4" stroke="#9fd6cc" stroke-width="2"/>
  <text x="594" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#028090">연산량이 많은 쪽</text>
  <text x="594" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">w12·d3·k3·std·e2.0·flatten</text>
  <rect x="436" y="146" width="316" height="38" rx="7" fill="#ffffff" stroke="#9fd6cc" stroke-width="0.9"/>
  <text x="452" y="170" font-size="13" fill="#475569">연산량 (MACs)</text>
  <text x="736" y="171" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">1,105,056</text>
  <rect x="436" y="190" width="316" height="38" rx="7" fill="#ffffff" stroke="#9fd6cc" stroke-width="0.9"/>
  <text x="452" y="214" font-size="13" fill="#475569">배치 1 지연</text>
  <text x="736" y="215" text-anchor="end" font-size="16" font-weight="700" fill="#028090">0.157 ms</text>
  <rect x="436" y="234" width="316" height="38" rx="7" fill="#ffffff" stroke="#9fd6cc" stroke-width="0.9"/>
  <text x="452" y="258" font-size="13" fill="#475569">정확도</text>
  <text x="736" y="259" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">87.96 %</text>
  <rect x="26" y="300" width="748" height="96" rx="12" fill="#07302e"/>
  <text x="400" y="328" text-anchor="middle" font-size="16" font-weight="700" fill="#58d6bd">왜? — MAC 하나를 처리하는 비용이 다르기 때문이다</text>
  <text x="400" y="356" text-anchor="middle" font-size="14" fill="#c3deda">깊이별 분리 1.058 ms / 100만 MAC     ·     일반 합성곱 0.139 ms / 100만 MAC</text>
  <text x="400" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#e4711b">같은 연산량을 처리하는 데 7.6배 오래 걸린다</text>

</svg>
