<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="800" height="350" fill="#f8fafc"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">0을 곱하는 데도 시간이 든다</text>
  <text x="400" y="50" text-anchor="middle" font-size="13" fill="#64748b">밀집 커널은 값이 0인지 확인하지 않는다 — 확인하는 것이 곱하는 것보다 비싸기 때문이다</text>

  <rect x="30" y="70" width="360" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="52" y="96" font-size="14.5" font-weight="700" fill="#334155">밀집 커널 (지금 우리가 쓰는 것)</text>

  <text x="52" y="124" font-size="12.5" fill="#64748b">가중치 (50%가 0)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="52" y="132" width="42" height="30" rx="4" fill="#e2e8f0"/><text x="73" y="152" fill="#334155">0.7</text>
    <rect x="98" y="132" width="42" height="30" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="119" y="152" fill="#94a3b8">0</text>
    <rect x="144" y="132" width="42" height="30" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="165" y="152" fill="#94a3b8">0</text>
    <rect x="190" y="132" width="42" height="30" rx="4" fill="#e2e8f0"/><text x="211" y="152" fill="#334155">0.3</text>
    <rect x="236" y="132" width="42" height="30" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="257" y="152" fill="#94a3b8">0</text>
    <rect x="282" y="132" width="42" height="30" rx="4" fill="#e2e8f0"/><text x="303" y="152" fill="#334155">0.5</text>
  </g>

  <text x="52" y="192" font-size="12.5" fill="#64748b">실제로 수행되는 곱셈</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="52" y="200" width="42" height="28" rx="4" fill="#fed7aa"/><text x="73" y="219" fill="#9a3412">×</text>
    <rect x="98" y="200" width="42" height="28" rx="4" fill="#fed7aa"/><text x="119" y="219" fill="#9a3412">×</text>
    <rect x="144" y="200" width="42" height="28" rx="4" fill="#fed7aa"/><text x="165" y="219" fill="#9a3412">×</text>
    <rect x="190" y="200" width="42" height="28" rx="4" fill="#fed7aa"/><text x="211" y="219" fill="#9a3412">×</text>
    <rect x="236" y="200" width="42" height="28" rx="4" fill="#fed7aa"/><text x="257" y="219" fill="#9a3412">×</text>
    <rect x="282" y="200" width="42" height="28" rx="4" fill="#fed7aa"/><text x="303" y="219" fill="#9a3412">×</text>
  </g>
  <text x="52" y="252" font-size="13.5" font-weight="700" fill="#b45309">곱셈 6번 — 절반이 0인데도 하나도 안 줄었다</text>

  <rect x="410" y="70" width="360" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="432" y="96" font-size="14.5" font-weight="700" fill="#334155">건너뛰려면 — 희소 형식</text>

  <text x="432" y="124" font-size="12.5" fill="#64748b">0이 아닌 값만 저장</text>
  <g font-size="13" text-anchor="middle">
    <rect x="432" y="132" width="42" height="30" rx="4" fill="#e2e8f0"/><text x="453" y="152" fill="#334155">0.7</text>
    <rect x="478" y="132" width="42" height="30" rx="4" fill="#e2e8f0"/><text x="499" y="152" fill="#334155">0.3</text>
    <rect x="524" y="132" width="42" height="30" rx="4" fill="#e2e8f0"/><text x="545" y="152" fill="#334155">0.5</text>
  </g>

  <text x="432" y="192" font-size="12.5" fill="#64748b">그런데 위치를 따로 적어야 한다</text>
  <g font-size="13" text-anchor="middle">
    <rect x="432" y="200" width="42" height="28" rx="4" fill="#ede9fe" stroke="#a78bfa"/><text x="453" y="219" fill="#5b21b6">0</text>
    <rect x="478" y="200" width="42" height="28" rx="4" fill="#ede9fe" stroke="#a78bfa"/><text x="499" y="219" fill="#5b21b6">3</text>
    <rect x="524" y="200" width="42" height="28" rx="4" fill="#ede9fe" stroke="#a78bfa"/><text x="545" y="219" fill="#5b21b6">5</text>
    <text x="600" y="219" font-size="12.5" text-anchor="start" fill="#7c3aed">← 인덱스</text>
  </g>
  <text x="432" y="252" font-size="13.5" font-weight="700" fill="#7c3aed">읽을 때마다 인덱스를 먼저 조회해야 한다</text>

  <rect x="30" y="286" width="740" height="46" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="400" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">인덱스를 따라 메모리를 뛰어다니는 비용 &gt; 아낀 곱셈</text>
  <text x="400" y="324" text-anchor="middle" font-size="12.5" fill="#9a3412">2·3주차 내내 본 그 이야기 — 나란히 읽는 것이 뛰어다니는 것보다 훨씬 싸다</text>
</svg>
