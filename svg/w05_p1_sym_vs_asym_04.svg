<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="760" height="300" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">대칭 vs 비대칭 양자화</text>

  <!-- Symmetric -->
  <text x="200" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">Symmetric (대칭)</text>
  <line x1="60" y1="120" x2="340" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="200" y1="105" x2="200" y2="135" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="152" text-anchor="middle" font-size="13" fill="#dc2626">0 ↔ 정수 0 (Z=0)</text>
  <rect x="120" y="112" width="160" height="16" fill="#bfdbfe" opacity="0.7"/>
  <text x="120" y="100" text-anchor="middle" font-size="13" fill="#1e40af">-|max|</text>
  <text x="280" y="100" text-anchor="middle" font-size="13" fill="#1e40af">+|max|</text>
  <text x="200" y="185" text-anchor="middle" font-size="13.5" fill="#334155">범위를 0 중심으로 대칭</text>
  <text x="200" y="205" text-anchor="middle" font-size="13" fill="#047857">Z=0 → 곱셈이 단순·빠름</text>
  <text x="200" y="225" text-anchor="middle" font-size="13" fill="#64748b">가중치에 주로 사용</text>

  <!-- Asymmetric -->
  <text x="560" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">Asymmetric (비대칭)</text>
  <line x1="420" y1="120" x2="700" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="480" y1="105" x2="480" y2="135" stroke="#dc2626" stroke-width="2"/>
  <text x="480" y="152" text-anchor="middle" font-size="13" fill="#dc2626">0 ↔ 정수 Z≠0</text>
  <rect x="480" y="112" width="180" height="16" fill="#ddd6fe" opacity="0.8"/>
  <text x="480" y="100" text-anchor="middle" font-size="13" fill="#6d28d9">min</text>
  <text x="660" y="100" text-anchor="middle" font-size="13" fill="#6d28d9">max</text>
  <text x="560" y="185" text-anchor="middle" font-size="13.5" fill="#334155">실제 데이터 분포에 맞춤</text>
  <text x="560" y="205" text-anchor="middle" font-size="13" fill="#6d28d9">Z로 치우친 범위 표현</text>
  <text x="560" y="225" text-anchor="middle" font-size="13" fill="#64748b">활성값(ReLU 등)에 유리</text>

  <text x="380" y="270" text-anchor="middle" font-size="13.5" fill="#334155">데이터가 0 중심이면 대칭이 효율적, 한쪽으로 치우치면 비대칭이 정확도에 유리</text>
</svg>
