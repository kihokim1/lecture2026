<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 316" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="800" height="316" fill="#f8fafc"/>
  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">경량화의 세 갈래 — 무엇에 손대는가</text>
  <text x="400" y="52" text-anchor="middle" font-size="13.5" fill="#64748b">앞의 둘은 완성된 모델을 손질하고, 증류는 학습 방법을 바꾼다</text>
  <rect x="30" y="72" width="230" height="196" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="145" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">4주차 · 프루닝</text>
  <text x="145" y="126" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">파라미터를 지운다</text>
  <text x="50" y="158" font-size="13" fill="#334155">· 큰 모델에서 출발</text>
  <text x="50" y="182" font-size="13" fill="#334155">· 학습이 끝난 뒤 손질</text>
  <text x="50" y="206" font-size="13" fill="#334155">· 잘라 낸 뒤 미세조정</text>
  <rect x="50" y="234" width="190" height="24" rx="6" fill="#ffffff" stroke="#f59e0b"/>
  <text x="145" y="251" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">바꾸는 대상: 완성된 모델</text>
  <rect x="285" y="72" width="230" height="196" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">5주차 · 양자화</text>
  <text x="400" y="126" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">덜 정밀하게 적는다</text>
  <text x="305" y="158" font-size="13" fill="#334155">· 큰 모델에서 출발</text>
  <text x="305" y="182" font-size="13" fill="#334155">· 학습 후 (또는 학습 중)</text>
  <text x="305" y="206" font-size="13" fill="#334155">· 재학습 없이도 된다</text>
  <rect x="305" y="234" width="190" height="24" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="400" y="251" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e40af">바꾸는 대상: 완성된 모델</text>
  <rect x="540" y="72" width="230" height="196" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="655" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">6주차 · 지식 증류</text>
  <text x="655" y="126" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">학습 방법을 바꾼다</text>
  <text x="560" y="158" font-size="13" fill="#334155">· 작은 모델에서 출발</text>
  <text x="560" y="182" font-size="13" fill="#334155">· 학습하는 동안</text>
  <text x="560" y="206" font-size="13" fill="#334155">· 크기는 미리 정해져 있다</text>
  <rect x="560" y="234" width="190" height="24" rx="6" fill="#ffffff" stroke="#10b981"/>
  <text x="655" y="251" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">바꾸는 대상: 학습 방법</text>
  <text x="400" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">셋은 서로 배타적이지 않다 — 증류로 잘 가르친 학생을 다시 양자화할 수 있다</text>

</svg>
