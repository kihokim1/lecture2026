<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 364" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="800" height="364" fill="#f8fafc"/>
  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">온도를 올리면 좋아질까 — 그리고 유사도 정보는 쓰이고 있나</text>
  <text x="400" y="52" text-anchor="middle" font-size="13.5" fill="#64748b">둘 다 전이 집합 프로토콜</text>
  <rect x="26" y="70" width="380" height="252" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="216.0" y="97" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0f172a">온도 T</text>
  <text x="216.0" y="117" text-anchor="middle" font-size="12.5" fill="#64748b">같은 시드·같은 초기값 · 단일 시행</text>
  <line x1="66" y1="268" x2="386" y2="268" stroke="#94a3b8"/>
  <path d="M76.0 178.6 L151.0 182.2 L226.0 182.2 L301.0 217.4 L376.0 236.4" fill="none" stroke="#028090" stroke-width="3"/>
  <circle cx="76.0" cy="178.6" r="6" fill="#028090"/>
  <text x="76.0" y="165.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">88.23</text>
  <text x="76.0" y="288" text-anchor="middle" font-size="12.5" fill="#475569">T=1</text>
  <circle cx="151.0" cy="182.2" r="6" fill="#028090"/>
  <text x="151.0" y="169.2" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">88.19</text>
  <text x="151.0" y="288" text-anchor="middle" font-size="12.5" fill="#475569">T=2</text>
  <circle cx="226.0" cy="182.2" r="6" fill="#028090"/>
  <text x="226.0" y="169.2" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">88.19</text>
  <text x="226.0" y="288" text-anchor="middle" font-size="12.5" fill="#475569">T=4</text>
  <circle cx="301.0" cy="217.4" r="6" fill="#e4711b"/>
  <text x="301.0" y="204.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">87.80</text>
  <text x="301.0" y="288" text-anchor="middle" font-size="12.5" fill="#475569">T=8</text>
  <circle cx="376.0" cy="236.4" r="6" fill="#e4711b"/>
  <text x="376.0" y="223.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">87.59</text>
  <text x="376.0" y="288" text-anchor="middle" font-size="12.5" fill="#475569">T=16</text>
  <path d="M76.0 198.2 V204.2 H226.0 V198.2" stroke="#94a3b8" stroke-width="1.6" fill="none"/>
  <text x="151.0" y="221.2" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b">구분되지 않는 평탄 구간</text>
  <text x="216.0" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">올려도 좋아지지 않고, 세게 켜면 손해</text>
  <rect x="424" y="70" width="350" height="252" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="599.0" y="97" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0f172a">유사도 정보를 파괴하면</text>
  <text x="599.0" y="117" text-anchor="middle" font-size="12.5" fill="#64748b">정답 아닌 칸의 확률만 뒤섞는다 (DKPP)</text>
  <line x1="446" y1="262" x2="758" y2="262" stroke="#94a3b8"/>
  <rect x="458" y="243.6" width="52" height="18.4" rx="3" fill="#94a3b8"/>
  <text x="484" y="235.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">85.64</text>
  <text x="484" y="280" text-anchor="middle" font-size="11.5" fill="#334155">기준선</text>
  <rect x="536" y="193.4" width="52" height="68.6" rx="3" fill="#e4711b"/>
  <text x="562" y="185.4" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">87.00</text>
  <text x="562" y="280" text-anchor="middle" font-size="11.5" fill="#334155">유사도</text>
  <text x="562" y="296" text-anchor="middle" font-size="11.5" fill="#334155">파괴(DKPP)</text>
  <rect x="614" y="158.4" width="52" height="103.6" rx="3" fill="#f59e0b"/>
  <text x="640" y="150.4" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">87.95</text>
  <text x="640" y="280" text-anchor="middle" font-size="11.5" fill="#334155">하드</text>
  <text x="640" y="296" text-anchor="middle" font-size="11.5" fill="#334155">의사 라벨</text>
  <rect x="692" y="164.7" width="52" height="97.3" rx="3" fill="#10b981"/>
  <text x="718" y="156.7" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">87.78</text>
  <text x="718" y="280" text-anchor="middle" font-size="11.5" fill="#334155">정상</text>
  <text x="718" y="296" text-anchor="middle" font-size="11.5" fill="#334155">소프트 타깃</text>
  <text x="599.0" y="314" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">틀린 관계 정보는 없느니만 못하다</text>
  <text x="400" y="346" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">유사도 정보는 분명히 쓰이고 있다 — 다만 그 몫은 전이 집합이 준 것보다 훨씬 작다</text>

</svg>
