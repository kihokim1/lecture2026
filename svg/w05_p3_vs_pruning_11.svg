<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="800" height="340" fill="#f8fafc"/>
  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">지난주와 나란히 놓고 보면</text>
  <text x="400" y="52" text-anchor="middle" font-size="13.5" fill="#64748b">같은 모델, 같은 기기 · 프루닝 99% vs INT8 완전 양자화 (실측)</text>

  <rect x="50" y="74" width="340" height="196" rx="10" fill="#ffffff" stroke="#fdba74"/>
  <text x="220" y="102" text-anchor="middle" font-size="15.5" font-weight="700" fill="#b45309">4주차 — 프루닝 99%</text>
  <text x="76" y="136" font-size="13.5" fill="#64748b">파일 크기</text>
  <text x="364" y="136" text-anchor="end" font-size="15.5" font-weight="700" fill="#94a3b8">그대로</text>
  <line x1="76" y1="148" x2="364" y2="148" stroke="#f1f5f9"/>
  <text x="76" y="176" font-size="13.5" fill="#64748b">속도</text>
  <text x="364" y="176" text-anchor="end" font-size="15.5" font-weight="700" fill="#94a3b8">1.02배</text>
  <line x1="76" y1="188" x2="364" y2="188" stroke="#f1f5f9"/>
  <text x="76" y="216" font-size="13.5" fill="#64748b">정확도</text>
  <text x="364" y="216" text-anchor="end" font-size="15.5" font-weight="700" fill="#dc2626">51.78%</text>
  <line x1="76" y1="228" x2="364" y2="228" stroke="#f1f5f9"/>
  <text x="76" y="254" font-size="12.5" fill="#9a3412">0으로 바꿨을 뿐 여전히 4바이트</text>

  <rect x="410" y="74" width="340" height="196" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="580" y="102" text-anchor="middle" font-size="15.5" font-weight="700" fill="#047857">5주차 — INT8 양자화</text>
  <text x="436" y="136" font-size="13.5" fill="#64748b">파일 크기</text>
  <text x="724" y="136" text-anchor="end" font-size="15.5" font-weight="700" fill="#047857">3.91배 작음</text>
  <line x1="436" y1="148" x2="724" y2="148" stroke="#f1f5f9"/>
  <text x="436" y="176" font-size="13.5" fill="#64748b">속도</text>
  <text x="724" y="176" text-anchor="end" font-size="15.5" font-weight="700" fill="#047857">1.94배</text>
  <line x1="436" y1="188" x2="724" y2="188" stroke="#f1f5f9"/>
  <text x="436" y="216" font-size="13.5" fill="#64748b">정확도</text>
  <text x="724" y="216" text-anchor="end" font-size="15.5" font-weight="700" fill="#047857">97.33%</text>
  <text x="724" y="234" text-anchor="end" font-size="11.5" fill="#64748b">(원본과 동일)</text>
  <text x="436" y="254" font-size="12.5" fill="#065f46">적는 방식 자체를 바꿨다 — 4바이트 → 1바이트</text>

  <rect x="50" y="288" width="700" height="38" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="400" y="312" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f46">둘 다 "줄인다"고 말하지만, 하드웨어가 실제로 다르게 취급한다</text>
</svg>
