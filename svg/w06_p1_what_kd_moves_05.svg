  <rect x="220" y="114" width="168" height="48" fill="#f7fbfa" stroke="#d3e5e2"/>
  <text x="304.0" y="144" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">1.00배 (안 줄어듦)</text>
  <rect x="388" y="114" width="168" height="48" fill="#f7fbfa" stroke="#d3e5e2"/>
  <text x="472.0" y="144" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">3.91배 작아짐</text>
  <rect x="556" y="114" width="178" height="48" fill="#fff7ed" stroke="#d3e5e2"/>
  <text x="645.0" y="145" text-anchor="middle" font-size="22" font-weight="700" fill="#e4711b">?</text>
  <rect x="34" y="162" width="186" height="48" fill="#ffffff" stroke="#d3e5e2"/>
  <text x="127.0" y="192" text-anchor="middle" font-size="13.5" font-weight="700" fill="#13282b">추론 지연</text>
  <rect x="220" y="162" width="168" height="48" fill="#ffffff" stroke="#d3e5e2"/>
  <text x="304.0" y="192" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">1.02배</text>
  <rect x="388" y="162" width="168" height="48" fill="#ffffff" stroke="#d3e5e2"/>
  <text x="472.0" y="192" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">1.94배 빨라짐</text>
  <rect x="556" y="162" width="178" height="48" fill="#fff7ed" stroke="#d3e5e2"/>
  <text x="645.0" y="193" text-anchor="middle" font-size="22" font-weight="700" fill="#e4711b">?</text>
  <rect x="34" y="210" width="186" height="48" fill="#f7fbfa" stroke="#d3e5e2"/>
  <text x="127.0" y="240" text-anchor="middle" font-size="13.5" font-weight="700" fill="#13282b">정확도</text>
  <rect x="220" y="210" width="168" height="48" fill="#f7fbfa" stroke="#d3e5e2"/>
  <text x="304.0" y="240" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">96.44% (원본 97.56%)</text>
  <rect x="388" y="210" width="168" height="48" fill="#f7fbfa" stroke="#d3e5e2"/>
  <text x="472.0" y="240" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">97.33% (그대로)</text>
  <rect x="556" y="210" width="178" height="48" fill="#fff7ed" stroke="#d3e5e2"/>
  <text x="645.0" y="241" text-anchor="middle" font-size="22" font-weight="700" fill="#e4711b">?</text>
  <text x="400" y="286" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">증류는 모델 구조를 전혀 바꾸지 않는다 — 그렇다면 위 두 칸에는 무엇이 들어갈까?</text>

</svg>
