<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 302" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="800" height="302" fill="#f8fafc"/>
  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">세 개의 숫자를 다시 잰다</text>
  <text x="400" y="52" text-anchor="middle" font-size="13.5" fill="#64748b">4·5주차와 같은 자로 6주차를 잰다 — 오른쪽 열은 3교시에서 채운다</text>
  <rect x="34" y="76" width="186" height="38" fill="#0e4a44"/>
  <text x="127.0" y="101" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">재는 것</text>
  <rect x="220" y="76" width="168" height="38" fill="#0e4a44"/>
  <text x="304.0" y="101" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">4주차 프루닝 90%</text>
  <rect x="388" y="76" width="168" height="38" fill="#0e4a44"/>
  <text x="472.0" y="101" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">5주차 INT8 양자화</text>
  <rect x="556" y="76" width="178" height="38" fill="#0e4a44"/>
  <text x="645.0" y="101" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">6주차 지식 증류</text>
  <rect x="34" y="114" width="186" height="48" fill="#f7fbfa" stroke="#d3e5e2"/>
